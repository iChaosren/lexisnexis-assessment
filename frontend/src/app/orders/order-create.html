<h2 class="title is-3">New order</h2>

<form class="box" [formGroup]="form" (ngSubmit)="submit()">
  <div class="columns">
    <div class="column">
      <div class="field">
        <label class="label" for="external-reference">Client reference</label>
        <div class="control">
          <input class="input" id="external-reference" name="externalReference" type="text" formControlName="externalReference">
        </div>
      </div>
    </div>
    <div class="column is-one-quarter">
      <div class="field">
        <label class="label" for="currency">Currency</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select id="currency" name="currency" formControlName="currency">
              <option value="">Choose currency</option>
              <option value="ZAR">ZAR</option>
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="field">
    <label class="label" for="customer">Customer</label>
    <div class="control">
      <div class="select is-fullwidth">
        <select id="customer" name="customerId" formControlName="customerId">
          <option value="">Choose customer</option>
          @for (customer of customers(); track customer.id) {
            <option [value]="customer.id">{{ customer.name }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <fieldset formArrayName="lines">
    <legend class="title is-5">Line items</legend>
    @for (line of form.controls.lines.controls; track line; let i = $index) {
      <div class="columns" [formGroupName]="i">
        <div class="column">
          <div class="field">
            <label class="label" for="line-sku-{{i}}">SKU</label>
            <div class="control">
              <input class="input" id="line-sku-{{i}}" name="sku" type="text" formControlName="sku">
            </div>
          </div>
        </div>
        <div class="column">
          <div class="field">
            <label class="label" for="line-name-{{i}}">Item Name</label>
            <div class="control">
              <input class="input" id="line-name-{{i}}" name="itemName" type="text" formControlName="name">
            </div>
          </div>
        </div>
        <div class="column is-one-fifth">
          <div class="field">
            <label class="label" for="line-quantity-{{i}}">Quantity</label>
            <div class="control">
              <input class="input" id="line-quantity-{{i}}" name="quantity" type="number" formControlName="quantity">
            </div>
          </div>
        </div>
        <div class="column is-one-fifth">
          <div class="field">
            <label class="label" for="line-price-{{i}}">Unit Price</label>
            <div class="control">
              <input class="input" id="line-price-{{i}}" name="unitPrice" type="number" step="any" formControlName="unitPrice">
            </div>
          </div>
        </div>
      </div>
    }
  </fieldset>

  <button class="button is-light mt-4 mr-2" type="button" (click)="addLine()" [disabled]="submitting()">Add line item</button>
  <button class="button is-primary mt-4" type="submit" [disabled]="submitting()">Submit order</button>
  <p class="mt-4" role="status">{{ submissionMessage() }}</p>
</form>
